<style>
  html { height: 100%; }
  body {
    margin: 0; padding: 0; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--appH, 100%);
  }
  #root { height: var(--appH, 100%); }
  #boot {
    position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; text-align: center; padding: 34px; background: #000;
    color: #8A8A91; font: 14px/1.5 -apple-system, system-ui, sans-serif;
  }
  #sw-bar {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 200; display: none; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 12px 12px 16px; border-radius: 14px; background: #16161B;
    border: 1px solid #2E2E36; box-shadow: 0 12px 30px rgba(0,0,0,.6);
    color: #E9E9EE; font: 14px -apple-system, system-ui, sans-serif;
  }
  #sw-bar.on { display: flex; }
  #sw-bar button {
    border: none; border-radius: 10px; padding: 9px 15px; cursor: pointer;
    background: #FF2E44; color: #150004; font: 600 14px -apple-system, system-ui, sans-serif;
  }
  #boot b { color: #FF2E44; font-size: 16px; }
  #boot code { color: #C9C9CE; font-size: 11px; word-break: break-word; display: block; margin-top: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot">
  <b>JavaScript isn't running</b>
  <span>You're seeing a preview, not the app.<br>
  Open the file in <b style="font-size:14px">Safari</b>, or better, use your GitHub Pages link.</span>
  <span id="boot-err"></span>
</div>

<script>
  /* iOS reports viewport units inconsistently depending on whether the
     browser toolbars are showing, which pushes the tab bar off-screen.
     Measuring the window directly is the only reliable way.
     innerHeight (not visualViewport) so the keyboard doesn't resize the app. */
  (function () {
    function fit() {
      var a = window.innerHeight || 0;
      var b = document.documentElement.clientHeight || 0;
      var h = (a && b) ? Math.min(a, b) : (a || b);
      document.documentElement.style.setProperty('--appH', h + 'px');
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('pageshow', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
  })();

  window.onerror = function (msg, src, line, col, err) {
    var b = document.getElementById('boot');
    if (!b) return;
    b.innerHTML = '<b>Something broke on startup</b>' +
      '<span>Send this line to Claude:<code>' +
      String((err && err.message) || msg) + ' @' + line + ':' + col + '</code></span>';

<script>
  (function () {
    var tries = 0;
    var t = setInterval(function () {
      var b = document.getElementById('boot');
      var r = document.getElementById('root');
      if (!b) return clearInterval(t);
      if (r && r.children.length) { b.remove(); clearInterval(t); }
      else if (++tries > 60) clearInterval(t);
    }, 50);
  })();
</script>
<div id="sw-bar" role="status">
  <span>A new version is ready.</span>
  <button id="sw-go">Reload</button>
</div>

<script>
  (function () {
    var bar = document.getElementById('sw-bar');
    document.getElementById('sw-go').onclick = function () { location.reload(); };
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
    navigator.serviceWorker.addEventListener('message', function (e) {
      if (e.data && e.data.type === 'update') bar.classList.add('on');
    });
  })();
</script>
