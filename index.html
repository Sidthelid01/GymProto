<style>
  html { height: 100%; }
  body {
    margin: 0; padding: 0; background: #000; overflow: hidden;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--appH, 100%);
  }
  #root { height: var(--appH, 100%); }
  #boot {
    position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; text-align: center; padding: 34px; background: #000;
    color: #8A8A91; font: 14px/1.5 -apple-system, system-ui, sans-serif;
  }
  #boot b { color: #FF2E44; font-size: 16px; }
  #boot code { color: #C9C9CE; font-size: 11px; word-break: break-word; display: block; margin-top: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot">
  <b>JavaScript isn't running</b>
  <span>You're seeing a preview, not the app.<br>
  Open the file in <b style="font-size:14px">Safari</b>, or better, use your GitHub Pages link.</span>
  <span id="boot-err"></span>
</div>

<script>
  /* iOS reports viewport units inconsistently depending on whether the
     browser toolbars are showing, which pushes the tab bar off-screen.
     Measuring the window directly is the only reliable way.
     innerHeight (not visualViewport) so the keyboard doesn't resize the app. */
  (function () {
    function fit() {
      var a = window.innerHeight || 0;
      var b = document.documentElement.clientHeight || 0;
      var h = (a && b) ? Math.min(a, b) : (a || b);
      document.documentElement.style.setProperty('--appH', h + 'px');
    }
    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('pageshow', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
  })();

  window.onerror = function (msg, src, line, col, err) {
    var b = document.getElementById('boot');
    if (!b) return;
    b.innerHTML = '<b>Something broke on startup</b>' +
      '<span>Send this line to Claude:<code>' +
      String((err && err.message) || msg) + ' @' + line + ':' + col + '</code></span>';

@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap');
.gr * { box-sizing:border-box; margin:0; }
.gr { font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-variant-numeric:tabular-nums; display:flex; justify-content:center;
  padding:24px 12px; background:var(--bg); min-height:100vh; }
.phone { padding-top:env(safe-area-inset-top); width:100%; max-width:390px; height:800px; background:var(--app); border-radius:34px;
  border:1px solid var(--line2); overflow:hidden; display:flex; flex-direction:column;
  position:relative; box-shadow:0 0 0 8px var(--bg), 0 0 60px var(--g2); }
.screen { flex:1; overflow-y:auto; padding:20px 20px 28px; -webkit-overflow-scrolling:touch; }
.screen::-webkit-scrollbar { width:0; }
h1.t { font-size:25px; font-weight:800; color:#F5F5F7; letter-spacing:-0.4px; line-height:1.15; }
h2.t { font-size:16px; font-weight:600; color:#F5F5F7; }
p.sub { font-size:13.5px; color:#8A8A91; line-height:1.5; margin-top:8px; }
.lbl { font-size:12px; color:#7C7C84; margin-bottom:7px; display:block; }
.btn { width:100%; padding:15px; border-radius:13px; border:none; cursor:pointer;
  font-family:inherit; font-size:15px; font-weight:600; color:var(--accFg); background:var(--acc); }
.btn { box-shadow:0 0 22px var(--g1); }
.btn:disabled { opacity:.35; cursor:not-allowed; box-shadow:none; }
.btn.ghost { box-shadow:none; }
.btn.ghost { background:transparent; color:#8A8A91; border:1px solid var(--line2); }
.btn:focus-visible,.seg button:focus-visible,.num button:focus-visible,
.chip:focus-visible,.tick:focus-visible { outline:2px solid #FF6B7A; outline-offset:2px; }
.seg { display:flex; gap:7px; flex-wrap:wrap; }
.seg button { flex:1; min-width:64px; padding:11px 4px; border-radius:11px; border:1px solid var(--line2);
  background:var(--surf); color:#8A8A91; font-family:inherit; font-size:13.5px; font-weight:500; cursor:pointer; }
.seg button[data-on="1"] { background:var(--acc); color:var(--accFg); border-color:var(--acc); }
.num { display:flex; align-items:center; gap:8px; }
.num button { width:40px; height:40px; flex:0 0 40px; border-radius:11px; border:1px solid var(--line2);
  background:var(--surf); color:#C9C9CE; font-size:19px; font-family:inherit; cursor:pointer; }
.num .val { flex:1; text-align:center; font-size:18px; font-weight:600; color:#F5F5F7; }
.card { background:var(--surf); border:1px solid var(--line); border-radius:15px; padding:15px; }
.row { display:flex; align-items:center; justify-content:space-between; }
.tabs { display:flex; border-top:1px solid var(--line); background:var(--tabbg); }
.tabs button { flex:1; padding:13px 0 20px; background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:12px; font-weight:500; color:#5A5A62; }
.tabs button[data-on="1"] { color:var(--acc); }
.setrow { display:flex; align-items:center; gap:9px; padding:7px 0; }
.setrow .idx { width:18px; font-size:13px; color:#5A5A62; }
.setrow input,.tin { width:100%; padding:11px 8px; border-radius:10px; border:1px solid var(--line2);
  background:var(--surf2); color:#F5F5F7; font-family:inherit; font-size:15px; font-weight:600; text-align:center; }
.tin.left { text-align:left; font-weight:500; }
.setrow input:focus,.tin:focus { outline:none; border-color:var(--accSoft); }
.tick { width:42px; height:42px; flex:0 0 42px; border-radius:10px; cursor:pointer;
  border:1px solid var(--line2); background:var(--surf); color:#5A5A62; font-size:16px; }
.tick[data-on="1"] { background:#0F2A19; border-color:#216B3C; color:#3FD97A; }
.bar { height:5px; background:var(--line); border-radius:3px; overflow:hidden; }
.bar i { display:block; height:100%; border-radius:3px; box-shadow:0 0 9px var(--g3); }
.chip { padding:6px 11px; border-radius:20px; border:1px solid var(--line2); background:var(--surf);
  color:#8A8A91; font-size:12px; font-family:inherit; cursor:pointer; }
.chip[data-on="1"] { background:var(--acc); color:var(--accFg); border-color:var(--acc); }
.sheet { position:absolute; inset:0; background:var(--app); z-index:20; display:flex; flex-direction:column; }
.back { display:inline-flex; align-items:center; gap:7px; background:var(--surf);
  border:1px solid var(--line2); color:#C9C9CE; font-family:inherit; font-size:14px;
  font-weight:500; cursor:pointer; padding:0 16px 0 13px; margin:0 0 16px 0;
